[profile.default]
src = "src"
out = "out"
test = 'test'
cache_path = 'cache'
libs = ["lib"]
solc = "0.8.38"
optimizer = true
optimizer_runs = 200
via_ir = true
build_info = true
evm_version = "prague"
extra_output = ["storageLayout"]
dynamic_test_linking = false

ignored_error_codes = [6335, 2424, 4591]
ignored_warnings_from = ["lib/**"]

[profile.smoke.fuzz]
runs = 128

[profile.smoke.invariant]
runs = 64
depth = 100

[profile.ci.fuzz]
runs = 512

[profile.ci.invariant]
runs = 512
depth = 500

[profile.release.fuzz]
runs = 1024

[profile.release.invariant]
runs = 1024
depth = 500

[rpc_endpoints]
sepolia = "${ETHEREUM_SEPOLIA_RPC}"
bsc_testnet = "${BSC_TESTNET_RPC}"
base_sepolia = "${BASE_SEPOLIA_RPC}"
arbitrum_sepolia = "${ARBITRUM_SEPOLIA_RPC}"

eth_mainnet = "${ETHEREUM_MAINNET_RPC}"
bsc_mainnet = "${BSC_MAINNET_RPC}"
base_mainnet = "${BASE_MAINNET_RPC}"

[etherscan]
# No custom `url` overrides: forge resolves the Etherscan V2 endpoint per chain and
# appends the required `chainid`. A fixed url base (e.g. ETHEREUMSCAN_API_URL) breaks
# every request with "Missing chainid parameter".
bsc_testnet = { key = "${ETHEREUMSCAN_API_KEY}", chain = "97" }
base_sepolia = { key = "${ETHEREUMSCAN_API_KEY}", chain = "84532" }
sepolia = { key = "${ETHEREUMSCAN_API_KEY}", chain = "11155111" }
arbitrum_sepolia = { key = "${ETHEREUMSCAN_API_KEY}", chain = "421614" }

eth_mainnet = { key = "${ETHEREUMSCAN_API_KEY}", chain = "1" }
bsc_mainnet = { key = "${ETHEREUMSCAN_API_KEY}", chain = "56" }
base_mainnet = { key = "${ETHEREUMSCAN_API_KEY}", chain = "8453" }

[lint]
ignore = ["test/**/*", "script/**/*"]
severity = ["high", "med", "low"]
# All detectors are active; accepted findings — including formerly inline-suppressed
# sites — live in script/harness/forge-lint-baseline.json. Only NEW findings fail:
# script/harness/forge-serialize.sh checks after every wrapped build/compile, and the
# gate checks on changed-file runs. Unwrapped direct `forge build` prints the full
# lint report — use the wrapper.

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

# 部署/验证档位 profiles（ops/deploy.sh uasset=15000，其余=100000）。
[profile.t15000]
optimizer_runs = 15000
[profile.t100000]
optimizer_runs = 100000
