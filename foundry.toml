[profile.default]
src = "src"
out = "out"
test = 'test'
cache_path = 'cache'
libs = ["lib"]
solc = "0.8.35"
optimizer = true
optimizer_runs = 200
via_ir = true
build_info = true
evm_version = "prague"
extra_output = ["storageLayout"]
# 4591 is solc's >256-warnings truncation notice; the overflow is dependency noise from lib/
# (see ignored_warnings_from below), so the notice carries no actionable signal.
ignored_error_codes = [6335, 2424, 4591]
# Dependencies are vendored in lib/ and their solc warnings (NatSpec/style) are not actionable here.
# Note solc's 256-warning emission cap applies before this display filter — src/ warnings are only
# guaranteed visible while total project warnings stay under the cap.
ignored_warnings_from = ["lib/**"]

[profile.smoke.fuzz]
runs = 128

[profile.smoke.invariant]
runs = 64
depth = 100

[profile.ci.fuzz]
runs = 512

[profile.ci.invariant]
runs = 512
depth = 500

[profile.release.fuzz]
runs = 1024

[profile.release.invariant]
runs = 1024
depth = 500

[rpc_endpoints]
bsc_testnet = "${BSC_TESTNET_RPC}"
base_sepolia = "${BASE_SEPOLIA_RPC}"
arbitrum_sepolia = "${ARBITRUM_SEPOLIA_RPC}"
sepolia = "${ETHEREUM_SEPOLIA_RPC}"
avalanche_fuji = "${AVALANCHE_FUJI_RPC}"
polygon_amoy = "${POLYGON_AMOY_RPC}"
sonic_testnet = "${SONIC_TESTNET_RPC}"
optimistic_sepolia = "${OPTIMISTIC_SEPOLIA_RPC}"
zksync_sepolia = "${ZKSYNC_SEPOLIA_RPC}"
linea_sepolia = "${LINEA_SEPOLIA_RPC}"
blast_sepolia = "${BLAST_SEPOLIA_RPC}"
scroll_sepolia = "${SCROLL_SEPOLIA_RPC}"
monad_testnet = "${MONAD_TESTNET_RPC}"
bera_sepolia = "${BERA_SEPOLIA_RPC}"

bsc_mainnet = "${BSC_MAINNET_RPC}"

[etherscan]
bsc_testnet = { key = "${ETHEREUMSCAN_API_KEY}", chain = "97", url = "${ETHEREUMSCAN_API_URL}" }
