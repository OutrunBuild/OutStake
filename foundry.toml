[profile.default]
src = "src"
out = "out"
test = 'test'
cache_path = 'cache'
libs = ["lib"]
solc = "0.8.35"
optimizer = true
optimizer_runs = 200
via_ir = true
build_info = true
evm_version = "prague"
extra_output = ["storageLayout"]
# 4591 is solc's >256-warnings truncation notice; the overflow is dependency noise from lib/
# (see ignored_warnings_from below), so the notice carries no actionable signal.
ignored_error_codes = [6335, 2424, 4591]
# Dependencies are vendored in lib/ and their solc warnings (NatSpec/style) are not actionable here.
# Note solc's 256-warning emission cap applies before this display filter — src/ warnings are only
# guaranteed visible while total project warnings stay under the cap.
ignored_warnings_from = ["lib/**"]

[profile.smoke.fuzz]
runs = 128

[profile.smoke.invariant]
runs = 64
depth = 100

[profile.ci.fuzz]
runs = 512

[profile.ci.invariant]
runs = 512
depth = 500

[profile.release.fuzz]
runs = 1024

[profile.release.invariant]
runs = 1024
depth = 500

[rpc_endpoints]
sepolia = "${ETHEREUM_SEPOLIA_RPC}"
bsc_testnet = "${BSC_TESTNET_RPC}"
base_sepolia = "${BASE_SEPOLIA_RPC}"

eth_mainnet = "${ETHEREUM_MAINNET_RPC}"
bsc_mainnet = "${BSC_MAINNET_RPC}"
base_mainnet = "${BASE_MAINNET_RPC}"

[etherscan]
bsc_testnet = { key = "${ETHEREUMSCAN_API_KEY}", chain = "97", url = "${ETHEREUMSCAN_API_URL}" }
base_sepolia = { key = "${ETHEREUMSCAN_API_KEY}", chain = "84532", url = "${ETHEREUMSCAN_API_URL}" }
sepolia = { key = "${ETHEREUMSCAN_API_KEY}", chain = "11155111", url = "${ETHEREUMSCAN_API_URL}" }

eth_mainnet = { key = "${ETHEREUMSCAN_API_KEY}", chain = "1", url = "${ETHEREUMSCAN_API_URL}" }
bsc_mainnet = { key = "${ETHEREUMSCAN_API_KEY}", chain = "56", url = "${ETHEREUMSCAN_API_URL}" }
base_mainnet = { key = "${ETHEREUMSCAN_API_KEY}", chain = "8453", url = "${ETHEREUMSCAN_API_URL}" }

[lint]
exclude_lints = [
    "mixed-case-variable", "mixed-case-function", "screaming-snake-case-immutable",
    "screaming-snake-case-const", "unaliased-plain-import", "erc20-unchecked-transfer",
    "block-timestamp",
]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
